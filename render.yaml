# Render Blueprint. Connect this repo as a Web Service and Render reads these
# settings. DATABASE_URL is filled in the dashboard (the Neon pooled URL) and
# is never stored in the repository. SESSION_SECRET is generated once on create.
services:
  - type: web
    name: personal-finances
    runtime: node
    plan: free
    # migrate deploy runs on start. If DATABASE_URL_UNPOOLED is unset, start
    # derives the direct Neon host from the pooled DATABASE_URL.
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_TIMEZONE
        value: Europe/Lisbon
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: XAI_API_KEY
        sync: false

